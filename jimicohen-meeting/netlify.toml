# Scheduling app. Deployed as its own Netlify site and proxied into
# https://jimicohen.com/meeting by a rewrite rule on the jimicohen site.

[build]
  command = "npm run build"
  publish = "dist"

# @netlify/blobs and @netlify/functions require Node 22.12 or newer (build and functions runtime).
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/meeting/"
  status = 302

# A hashed file that is not there (an open tab asking for a chunk of an older deploy) is a real 404,
# never the HTML shell with status 200 handed out as a script. Not forced, so files that exist win.
[[redirects]]
  from = "/meeting/assets/*"
  to = "/meeting/index.html"
  status = 404

# SPA fallback. Not forced, so real files (assets) and the API function win.
[[redirects]]
  from = "/meeting/*"
  to = "/meeting/index.html"
  status = 200

[[headers]]
  for = "/meeting/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/meeting/*"
  [headers.values]
  Content-Security-Policy = "default-src 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self'; manifest-src 'self'; upgrade-insecure-requests"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

# The dashboard must never be framed. Public booking pages may be embedded.
# Search engines stay away from the dashboard, the co-host pages and the manage links (which carry
# their token in the address). These headers also reach visitors through the jimicohen.com proxy.
# Never add noindex for all of /meeting/*: it would take the real booking pages out of search too.
[[headers]]
  for = "/meeting/admin/*"
  [headers.values]
  X-Frame-Options = "DENY"
  Cache-Control = "no-store"
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/meeting/host/*"
  [headers.values]
  X-Frame-Options = "DENY"
  Cache-Control = "no-store"
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/meeting/booking/*"
  [headers.values]
  X-Robots-Tag = "noindex, nofollow"
