# GrowSigning in one container, with one volume. A starting point: copy it, read it, change it.
#
#   cp .env.example .env            every setting is in there with what it does; fill in what you use
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose up -d --build
#   docker compose ps               "healthy" once GET /api/health answers 200
#
# Every setting from .env.example reaches the server through "env_file" below, so nothing has to be listed twice.
# The few lines under "environment" are the ones a container needs to be different from a laptop.
#
# Put a reverse proxy with TLS in front of it (your own, or the platform's). The app speaks plain http on port 3000
# and does no TLS itself. Set APP_URL to the public https address and TRUSTED_PROXY_HOPS to the number of proxies.
#
# One container, never two on the same volume: the database is SQLite, which has one writer.
services:
  growsigning:
    build:
      context: .
      args:
        # 1 puts LibreOffice in the image, for CONVERTER=soffice (office files turned into PDF on this machine).
        # In this container LibreOffice then has whatever network the container has: "unshare -rn", which the server
        # uses to take the network away from it, is not permitted here (cap_drop ALL, no-new-privileges). Deny
        # egress in the network around the container before you switch it on (README, "Running it yourself").
        WITH_LIBREOFFICE: "0"
    image: growsigning:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      # Only this machine can reach it; the reverse proxy passes requests on. Change to "3000:3000" only on a private network.
      - "127.0.0.1:3000:3000"
    volumes:
      # Everything the server stores: the database (sign.db) and the stored files (blobs/). Back it up with
      # scripts/backup.mjs (see README, "Running it yourself"); a copy of the folder taken while the server runs is
      # not a backup.
      - growsigning-data:/data
    # Nothing but the volume and two small in-memory folders can be written to.
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /app/.next/cache:size=256m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The image has the same check built in; it is repeated here so that it can be read and changed in one place.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # A backup, run by hand or from the host's scheduler (not started by "up"). Make the folder first and give it to
  # the user the container runs as (uid 1000), or Docker makes it as root and the backup cannot write to it:
  #   mkdir -p backups && sudo chown 1000:1000 backups && chmod 700 backups
  #   docker compose run --rm backup
  # It writes a dated folder into ./backups on the host. The keys are never in it: keep FILE_ENCRYPTION_KEY and
  # APP_SECRET in a secret store of your own, apart from the backups.
  backup:
    image: growsigning:local
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - growsigning-data:/data
      - ./backups:/backups
    user: "1000:1000"
    read_only: true
    network_mode: none
    command: ["node", "scripts/backup.mjs", "/backups"]

volumes:
  growsigning-data:
