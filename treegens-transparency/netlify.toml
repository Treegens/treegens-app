# Treegens Transparency — static site.
#
# Deployed as its own Netlify project ("treegens-ledger", id 3e4640f8-…) with
# the custom domain transparency.treegens.app (Jimi's decision, 2026-10-18).
# treegens.app's DNS is not on Netlify, so the hostname needs a CNAME
# `transparency` → treegens-ledger.netlify.app at the DNS provider; Netlify
# then issues the certificate by itself. Do NOT attach treegens.app /
# www.treegens.app / world.treegens.app / greenlegacy.app /
# ashaaraamagariisaa.com here — see the repo's CLAUDE.md.
#
# Runtime config lives in public/config.js (API base URL, RPC, explorer), so
# the same build can be pointed at another API without rebuilding.

[build]
  base = "treegens-transparency"
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
