{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- if or (not .Values.secret.appSecret) (not .Values.secret.fileEncryptionKey) }}
{{- fail "secret.create=true needs secret.appSecret and secret.fileEncryptionKey (openssl rand -base64 32 makes each)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keys
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  APP_SECRET: {{ .Values.secret.appSecret | quote }}
  FILE_ENCRYPTION_KEY: {{ .Values.secret.fileEncryptionKey | quote }}
{{- end }}
