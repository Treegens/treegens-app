# Render blueprint — Treegens backend on Base MAINNET.
#
# Serves both treegens.app and world.treegens.app from one API, with the
# reward-claim and slash workers running as separate Background Workers so a
# long-running job can never block or crash the API.
#
#   treegens-api            web service   ENABLE_*_WORKER = false
#   treegens-redis          key value     BullMQ queues
#   treegens-reward-worker  worker        npm run start:worker
#   treegens-slash-worker   worker        npm run start:slash-worker
#
# Secrets (sync: false) are set in the Render dashboard, never committed.

services:
  # -------------------------------------------------------------- Redis ----
  # Declared first so the services below can resolve its connection string.
  # Key Value instances live in `services`, not a top-level key.
  - type: keyvalue
    name: treegens-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction # BullMQ requires jobs are never evicted
    ipAllowList: [] # internal-only: reachable from Render services, not the internet

  # ---------------------------------------------------------------- API ----
  - type: web
    name: treegens-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: treegens-backend-main
    # --include=dev is required: NODE_ENV=production makes npm ci skip
    # devDependencies, and typescript/@types/node live there.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: TGN_TOKEN_ADDRESS
        value: "0xD75dfa972C6136f1c594Fec1945302f885E1ab29"
      # TGNVault (staking/slash) on Base mainnet — verifier stake checks.
      - key: TGN_VAULT_ADDRESS
        value: "0x82a54F550131140Cc08Cf2b10Aa3a44fFDDa582C"
      - key: MGRO_TOKEN_ADDRESS
        value: "0x46e564D039d0d7Ec4C88d517fD32a03d15e88568"
      # Workers run as their own services — never in the API process.
      - key: ENABLE_REWARD_CLAIM_WORKER
        value: "false"
      - key: ENABLE_SLASH_WORKER
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: treegens-redis
          property: connectionString
      - key: MONGODB_URI
        sync: false
      # Shared Atlas cluster, own database — see src/config/database.ts.
      - key: MONGODB_DB_NAME
        value: treegens-app
      - key: JWT_SECRET
        sync: false
      # Google Cloud Storage is the sole media backend (Pinata/IPFS removed).
      - key: GCS_BUCKET
        sync: false
      - key: GCS_SERVICE_ACCOUNT_JSON
        sync: false
      - key: THIRDWEB_SECRET_KEY
        sync: false
      - key: MGRO_MINTER_PRIVATE_KEY
        sync: false
      - key: DISTRIBUTOR_API_KEY
        sync: false
      # OTC desk (pay planters by M-Pesa, buyer keeps the MGRO). The buyer
      # wallet is a public address, so it lives here and ships with the
      # Blueprint. Telegram alerts are optional: add OTC_TELEGRAM_BOT_TOKEN and
      # OTC_TELEGRAM_CHAT_ID in the dashboard to turn them on (kept out of
      # the Blueprint so a sync never waits for input). The public app URL is
      # this repo's Netlify deploy, never treegens.app.
      - key: OTC_BUYER_WALLETS
        value: "0xce97a429b00ed6b99a1fc839404ec6cc5f40cc39"
      - key: OTC_PUBLIC_APP_URL
        value: https://treegens-app-web.netlify.app
      # Whole planter share to the buyer in one mint on confirmation (D1).
      - key: OTC_RELEASE_MODE
        value: full
      # Deals payable as soon as the AI counted a fundable batch (D3).
      - key: OTC_PAY_ON
        value: ai_count
      - key: OTC_CONFIRM_REQUIRES_REF
        value: "true"
      - key: OTC_DEAL_EXPIRY_DAYS
        value: "14"
      - key: OTC_BUYER_DISPLAY_NAME
        value: TreeGens
      # The 5-minute OTC sweep runs here, in the API process only.
      - key: ENABLE_OTC_RECONCILER
        value: "true"

  # ------------------------------------------------- reward claim worker ----
  - type: worker
    name: treegens-reward-worker
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: treegens-backend-main
    # --include=dev is required: NODE_ENV=production makes npm ci skip
    # devDependencies, and typescript/@types/node live there.
    buildCommand: npm ci --include=dev && npm run build
    # Standalone worker entrypoint (dist/workers/rewardClaimWorker.js) — the
    # script sets RUN_REWARD_CLAIM_WORKER itself. No HTTP server is started.
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: MGRO_TOKEN_ADDRESS
        value: "0x46e564D039d0d7Ec4C88d517fD32a03d15e88568"
      # Stay false everywhere: these only start workers INSIDE the API process.
      - key: ENABLE_REWARD_CLAIM_WORKER
        value: "false"
      - key: ENABLE_SLASH_WORKER
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: treegens-redis
          property: connectionString
      - key: MONGODB_URI
        sync: false
      # Shared Atlas cluster, own database — see src/config/database.ts.
      - key: MONGODB_DB_NAME
        value: treegens-app
      - key: MGRO_MINTER_PRIVATE_KEY
        sync: false

  # -------------------------------------------------------- slash worker ----
  - type: worker
    name: treegens-slash-worker
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: treegens-backend-main
    # --include=dev is required: NODE_ENV=production makes npm ci skip
    # devDependencies, and typescript/@types/node live there.
    buildCommand: npm ci --include=dev && npm run build
    # Standalone worker entrypoint (dist/workers/slashWorker.js) — the script
    # sets RUN_SLASH_WORKER itself. No HTTP server is started.
    startCommand: npm run start:slash-worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      # TGNVault (staking/slash) on Base mainnet — treasury() = the 2-of-4 Safe.
      - key: TGN_VAULT_ADDRESS
        value: "0x82a54F550131140Cc08Cf2b10Aa3a44fFDDa582C"
      # Stay false everywhere: these only start workers INSIDE the API process.
      - key: ENABLE_REWARD_CLAIM_WORKER
        value: "false"
      - key: ENABLE_SLASH_WORKER
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: treegens-redis
          property: connectionString
      - key: MONGODB_URI
        sync: false
      # Shared Atlas cluster, own database — see src/config/database.ts.
      - key: MONGODB_DB_NAME
        value: treegens-app
      - key: TGN_VAULT_SLASHER_PRIVATE_KEY
        sync: false
